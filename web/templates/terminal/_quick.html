{% for label, cmd in cmds %}{% if xterm %}<button class="chip-btn" type="button" data-term-insert="{{ cmd }}" title="{{ cmd }} (giriş satırına yazılır)">{{ label }}</button>{% else %}<button class="chip-btn" type="button" data-fill='{{ {"#command": cmd}|tojson|forceescape }}' title="{{ cmd }}">{{ label }}</button>{% endif %}{% else %}<span class="muted small">uygulama seçin</span>{% endfor %}
