<div class="banner banner-error">{{ icon('alert') }}<div>
  <b>PROD ortamında çalıştırılacak</b><br><span class="mono">{{ pod }}/{{ container }} $ {{ command }}</span>
  {% if warn %}<br><b>{{ warn }}</b>{% endif %}
</div>
<form hx-post="/k8s/exec" hx-target="closest .banner" hx-swap="outerHTML">
  <input type="hidden" name="env" value="{{ env }}"><input type="hidden" name="pod" value="{{ pod }}">
  <input type="hidden" name="container" value="{{ container }}"><input type="hidden" name="command" value="{{ command }}">
  <input type="hidden" name="app" value="{{ app }}"><input type="hidden" name="confirm" value="{{ token }}">
  <button class="btn primary sm" type="submit">Evet, çalıştır</button>
</form></div>
