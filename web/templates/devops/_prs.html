{% import "_macros.html" as m %}
<div class="table-wrap"><table class="tbl compact"><thead><tr><th>#</th><th>Başlık</th><th>Açan</th><th>Dal</th><th>Zaman</th></tr></thead><tbody>
{% for p in rows %}<tr><td>{{ m.ext_link(p.url, p.id|string) }}</td><td class="wrap">{% if p.draft %}<span class="chip">taslak</span> {% endif %}{{ p.title }}</td>
<td class="nowrap">{{ p.author }}</td><td class="mono small">{{ p.source }} → {{ p.target }}</td><td class="nowrap muted">{{ p.created|ago }}</td></tr>
{% else %}<tr><td colspan="5">{{ m.empty("Açık PR yok.", "git") }}</td></tr>{% endfor %}</tbody></table></div>
