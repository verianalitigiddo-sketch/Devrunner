<form class="composer" hx-post="/chat/send" hx-target="#composer">
  <input type="hidden" name="room" value="{{ room }}">
  <input class="input" name="text" id="chat-text" value="{{ text or '' }}" placeholder="Mesaj gönder…  (Enter)" autocomplete="off" maxlength="4000" autofocus>
  <button class="btn primary" type="submit">{{ icon('send') }} Gönder</button>
</form>
