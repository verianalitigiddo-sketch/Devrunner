{% if rows %}<div class="table-wrap" style="max-height:30vh"><table class="tbl compact"><thead><tr><th></th><th>Başlık</th><th>Adres</th></tr></thead><tbody>
{% for r in rows %}<tr><td>{% if not r.ok %}<span class="pill danger">geçersiz</span>{% elif r.dup %}<span class="pill warning">kayıtlı</span>{% else %}<span class="pill success">yeni</span>{% endif %}</td>
<td>{{ r.title }}</td><td class="small mono">{{ r.url }}</td></tr>{% endfor %}</tbody></table></div>{% endif %}
